<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SantriCraft: Logic Quest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'VT323', monospace; }
        
        /* Custom Shake Animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Custom Jump Animation */
        @keyframes jump-happy {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
        .animate-jump-happy {
            animation: jump-happy 0.5s ease-out;
        }

        /* Cloud Animation */
        @keyframes move-cloud {
            from { transform: translateX(-100%); }
            to { transform: translateX(400%); }
        }
        .animate-cloud {
            animation: move-cloud 20s linear infinite;
        }
        .animate-cloud-slow {
            animation: move-cloud 35s linear infinite;
        }

        /* Floating Icon Animation */
        @keyframes float-icon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-float {
            animation: float-icon 2s ease-in-out infinite;
        }

        /* Text Shadow */
        .text-shadow {
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        /* Voxel Button Effects */
        .btn-voxel {
            box-shadow: 0px 4px 0px 0px rgba(0,0,0,0.4);
            transition: all 0.1s;
        }
        .btn-voxel:active {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px 0px rgba(0,0,0,0.4);
        }
    </style>
