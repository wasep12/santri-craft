    <style>
        body { font-family: 'VT323', monospace; }
        
        /* --- MINECRAFT STYLE SCROLLBAR --- */
        /* Width */
        ::-webkit-scrollbar {
            width: 16px;
            height: 16px;
        }

        /* Track (Background) - Dark Stone Color */
        ::-webkit-scrollbar-track {
            background: #1e1e1e; 
            border-left: 2px solid #000;
        }

        /* Handle (Thumb) - Stone Block Style */
        ::-webkit-scrollbar-thumb {
            background: #7f7f7f; /* Base gray */
            border: 2px solid #000; /* Black outline */
            box-shadow: inset 2px 2px 0px rgba(255, 255, 255, 0.3), /* Highlight top-left */
                        inset -2px -2px 0px rgba(0, 0, 0, 0.3); /* Shadow bottom-right */
        }

        /* Handle on hover */
        ::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        /* Corner */
        ::-webkit-scrollbar-corner {
            background: #1e1e1e;
        }

        /* --- ANIMATIONS --- */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Custom Jump Animation */
        @keyframes jump-happy {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
        .animate-jump-happy {
            animation: jump-happy 0.5s ease-out;
        }

        /* Cloud Animation */
        @keyframes move-cloud {
            from { transform: translateX(-100%); }
            to { transform: translateX(400%); }
        }
        .animate-cloud {
            animation: move-cloud 20s linear infinite;
        }
        .animate-cloud-slow {
            animation: move-cloud 35s linear infinite;
        }

        /* Ground/Grass Movement Animation */
        @keyframes move-ground {
            from { background-position-x: 0px; }
            to { background-position-x: 80px; }
        }

        /* Floating Icon Animation */
        @keyframes float-icon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-float {
            animation: float-icon 2s ease-in-out infinite;
        }

        /* Text Shadow */
        .text-shadow {
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        /* Voxel Button Effects */
        .btn-voxel {
            box-shadow: 0px 4px 0px 0px rgba(0,0,0,0.4);
            transition: all 0.1s;
        }
        .btn-voxel:active {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px 0px rgba(0,0,0,0.4);
        }
        
        /* Material Icons Tweaks for Pixel Art Vibe */
        .material-icons {
            font-size: 28px; /* Default size */
        }
        @media (min-width: 768px) {
            .material-icons {
                font-size: 36px;
            }
        }
    </style>
